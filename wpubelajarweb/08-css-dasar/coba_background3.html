<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba background</title>
    <style>
        body{
            background-color: lightblue;
            background-image: linear-gradient(19deg,green, blue, grey, black);
            height: 100vh;
        }
        .kotak1{
            width: 200px;
            height: 200px;
            background-color: salmon ;
            background-image: linear-gradient(to bottom, lightblue, salmon);
        }

        .kotak2{
            width: 200px;
            height: 200px;
            background-color: salmon ;
            background-image: radial-gradient(lightblue, salmon);
        }
        .kotak3{
            width: 200px;
            height: 200px;
            background-color: salmon ;
            background-image: conic-gradient(lightblue, salmon, violet);
        }
    </style>
</head>
<body>
    <div class="kotak1"> hai</div>
    <div class="kotak2"> hai</div>
    <div class="kotak3"> hai</div>
</body>
</html>
