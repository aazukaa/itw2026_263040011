
<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quote Kehidupan</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Poppins', sans-serif;
        color: white;
        background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        text-align: center;
      }

      h1 {
        font-family: 'Playfair Display', serif;
        font-size: 48px;
        margin-bottom: 35px;
        letter-spacing: 2px;
        background: linear-gradient(90deg, #a18cd1, #fbc2eb);
        background-clip: text;
        color: transparent;
      }

      .quote {
        max-width: 650px;
        padding: 50px 40px;
        font-size: 19px;
        font-weight: 300;
        line-height: 2.5;
        letter-spacing: 1px;

        background: rgb(255 255 255 / 8%);
        backdrop-filter: blur(15px);
        border: 1px solid rgb(255 255 255 / 15%);
        border-radius: 25px;

        box-shadow: 0 15px 40px rgb(0 0 0 / 30%);
      }

      span {
        color: #fbc2eb;
        font-weight: 600;
        text-shadow: 0 0 15px rgb(251 194 235 / 50%);
      }

      .credit {
        margin-top: 35px;
        padding-top: 15px;
        border-top: 1px solid rgb(255 255 255 / 25%);
        width: 250px;
        font-size: 12px;
        letter-spacing: 3px;
        color: #b8b5d1;
        text-transform: uppercase;
      }

      .subtitle {
        font-size: 12px;
        color: #aaa4c8;
        letter-spacing: 5px;
        margin-bottom: 15px;
        text-transform: uppercase;
      }
    </style>
  </head>

  <body>

    <p class="subtitle">A little reminder</p>

    <h1>Perjalanan Hidup</h1>

    <p class="quote">
      "Hidup bukan tentang <span>kesempurnaan</span>. <br />
      Tetapi tentang <span>perjuangan</span>. <br />
      Jangan takut untuk melangkah <br />
      Karena setiap perjalanan akan membawamu menuju
      <span>kesuksesan</span>."
    </p>

    <p class="credit">
      — Azka
    </p>

  </body>
</html>
