<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select & text area</title>
</head>
<body>
    <h3>Pilih kota</h3>
    <form>
    <select name="kota" id="kota" required>
        <option>pilih salah satu</option>
        <option value="bdg">Bandung</option>
        <option value="jkt">jakarta</option>
        <option value="bgr">Bogor</option>
        <option value="srb">Surabaya</option>
        <option value="ngw">Ngawi</option>
        <option value="mlg">Malang</option>
        <option value="diy">Daerah Istimewa Yogyakarta</option>
        
    </select>
    <br> <br>
    <h3>about me</h3>

    <textarea name="about" id="about" cols="50" rows="10" placeholder="masukan tentang diri anda"></textarea>
    <br> <br>
    <button type="submit">KIRIM!</button>   
    </form>
</body>
</html>
