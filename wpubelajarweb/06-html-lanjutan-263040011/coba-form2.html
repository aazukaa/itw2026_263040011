<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh input atribut, checkbox&radio button</title>
</head>
<body>
    <h1>contoh input atribut, checkbox&radio</h1>

    <form>
        <label for="nama">nama:
            <input type="nama" name="nama" id="nama" placeholder="masukan nama"
            autocomplete="off"  autofocus required
            <br>
 
        </label>

    <br>
    <h3>HOBI</h3>

    <label for="hobi1">main game</label>
    <input type="checkbox" name="hobi1" id="hobi1" value="main game">
    <br>

    <label for="hobi1">main bola</label>
    <input type="checkbox" name="hobi2" id="hobi2" value="main bola" checked>
    <br>


    <br>

    <h3>gender:</h3>

    <label for="pria">
        <input type="radio" name="gender" id="pria" value="pria">
        pria
    </label>
     <br>

     <label for="wanita">
        <input type="radio" name="gender" id="wanita" value="wanita">
        wanita
     </label> <br>
    <button type="submit">KIRIM!</button> 
    </form>
</body>
</html>
