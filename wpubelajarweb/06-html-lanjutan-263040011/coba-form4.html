<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba element form</title>
</head>
<body>
    <h1>Contoh contoh element form di dalam tabel</h1>
    <form>

    <table cellpadding="4">
        <tr>
            <td align="right"><label for="nama">nama:</label> </td>
            <td><input type="text" id="nama" name="nama" placeholder="nama sampean sopo cuk"></td>
        </tr>
        <tr>
            <td align="right"><label for="password">password:</label></td>
            <td><input type="password" id="password" name="password" placeholder="password"></td>
        </tr>
        <tr>
            <td align="right"><label for="email">email:</label></td>
            <td><input type="email" id="email" name="email" placeholder="masukan email"></td>
        </tr>
        <tr>
            <td align="right"><label for="number">angka:</label></td>
            <td><input type="number" id="number" name="number" placeholder="masukan angka"
            min="0" max="120" step="10"></td>
        </tr>
        <tr>
            <td align="right"><label for="date">date:</label></td>
            <td><input type="date" name="date" id="date"></td>
        </tr>
        <tr>
            <td align="right"><label for="warna">warna:</label></td>
            <td><input type="color" name="warna" id="warna"></td>
        </tr>
        <tr colspan="2">
            <td><button type="submit">KIRIM!</button></td>
        </tr>
    </table>
     
    </form>

</body>
</html>
